# Dataset Configuration for Computer Vision / License Plate Recognition
dataset:
  name: "thai-license-plate-vision"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_split: "data/splits/train.txt"
  val_split: "data/splits/val.txt"
  test_split: "data/splits/test.txt"

image:
  channels: 3
  height: 64
  width: 192
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  rotation_range: [-5, 5]
  perspective_distortion: 0.1
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
  gaussian_blur:
    kernel_size: 3
    sigma: [0.1, 1.5]

vocabulary:
  blank_symbol: "<blank>"
  digits: "0123456789"
  # 41 DLT Valid Thai Consonants (excluding obsolete ฃ, ฅ, and confusing ฏ)
  thai_consonants: "กขคฆงจฉชซฌญฎฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ"
  max_text_length: 8
