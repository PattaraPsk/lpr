# Ultralytics YOLO Hyperparameters optimized for Thai License Plate Detection on Edge Hardware

# Optimizer & Learning Rate
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss Gains
box: 7.5
cls: 0.5
dfl: 1.5

# Data Augmentation (Tuned for vehicle & plate variance)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0          # Max rotation (+/- 10 deg)
translate: 0.1         # Translation (+/- 10%)
scale: 0.5             # Scale (+/- 50%)
shear: 2.0             # Perspective shear (+/- 2 deg)
perspective: 0.0001
flipud: 0.0            # NEVER flip plates upside down
fliplr: 0.5            # Horizontal flip for vehicles
mosaic: 1.0            # Mosaic augmentation (improves small plate detection)
mixup: 0.15
copy_paste: 0.1
